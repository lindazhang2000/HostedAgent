# Foundry hosted-agent declarative manifest used by `azd up`.
#
# The `azd` CLI:
#   1. Builds src/Dockerfile and pushes the image to the ACR provisioned by
#      infra/main.bicep.
#   2. Calls AIProjectClient.agents.create_version with this manifest, which
#      registers a new immutable version of the hosted agent.
#   3. Foundry assigns the agent its own Microsoft Entra identity, provisions
#      a sandbox on first invocation, and exposes the Responses endpoint:
#        {project_endpoint}/agents/echo-agent/endpoint/protocols/openai/v1/responses
#
# Reference:
#   https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents

name: echo-agent
description: Minimal Foundry hosted agent (Responses protocol) sample.

container:
  image: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}/echo-agent:${AZURE_BUILD_TAG}
  port: 8088
  resources:
    cpu: 0.5
    memory: 1Gi

protocols:
  - responses

env:
  - name: MODEL_DEPLOYMENT
    value: gpt-4o
  - name: SYSTEM_PROMPT
    value: |
      You are a helpful Foundry hosted agent. Answer concisely.
  # FOUNDRY_PROJECT_ENDPOINT is injected automatically by the runtime.

# Idle compute is deprovisioned after 15 minutes; session state ($HOME and
# /files) is persisted for up to 30 days. See the hosted-agents concept doc.
