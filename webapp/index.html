<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zava Hosted Agent Chat</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 820px; margin: 0 auto; padding: 16px;
      background: #f6f7fb; color: #111;
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    select, button, input {
      font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccd; background: #fff;
    }
    button { cursor: pointer; background: #4f46e5; color: #fff; border-color: #4338ca; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log {
      background: #fff; border: 1px solid #e2e4ee; border-radius: 12px;
      padding: 12px; min-height: 60vh; max-height: 70vh; overflow-y: auto;
    }
    .msg { margin: 10px 0; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
    .user { background: #eef2ff; align-self: flex-end; }
    .bot { background: #f1f5f9; }
    .tools { font-size: 0.78rem; color: #555; margin-top: 4px; padding-left: 8px; border-left: 2px solid #cbd5e1; }
    .tools code { background: #e2e8f0; padding: 1px 4px; border-radius: 4px; }
    .composer { display: flex; gap: 8px; margin-top: 12px; }
    .composer input { flex: 1; }
    .meta { font-size: 0.75rem; color: #6b7280; margin-bottom: 4px; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Zava hosted-agent chat</h1>
  <div class="toolbar">
    <label>Agent:
      <select id="agent">
        <option value="cora" selected>cora</option>
        <option value="interior-designer">interior-designer</option>
        <option value="inventory">inventory</option>
        <option value="customer-loyalty">customer-loyalty</option>
        <option value="cart-manager">cart-manager</option>
      </select>
    </label>
    <label><input type="checkbox" id="threaded" checked /> keep conversation</label>
    <button id="reset" type="button">New chat</button>
  </div>
  <div id="log"></div>
  <form class="composer" id="form">
    <input id="input" autocomplete="off" placeholder="Message the agent…" required />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const agentSel = document.getElementById('agent');
    const threaded = document.getElementById('threaded');
    let lastResponseId = null;

    function add(cls, text, meta) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      if (meta) {
        const m = document.createElement('div');
        m.className = 'meta';
        m.textContent = meta;
        d.appendChild(m);
      }
      d.appendChild(document.createTextNode(text));
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }

    function addTools(parent, calls) {
      if (!calls || !calls.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'tools';
      for (const c of calls) {
        const line = document.createElement('div');
        line.innerHTML = `<code>${c.name}</code>(${escapeHtml(c.arguments)})`;
        wrap.appendChild(line);
        if (c.output) {
          const out = document.createElement('div');
          out.textContent = '↳ ' + truncate(c.output, 240);
          wrap.appendChild(out);
        }
      }
      parent.appendChild(wrap);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
    }
    function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

    document.getElementById('reset').addEventListener('click', () => {
      lastResponseId = null;
      log.innerHTML = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add('user', message);
      input.value = '';
      sendBtn.disabled = true;
      const pending = add('bot', '…thinking…');
      try {
        const body = {
          agent: agentSel.value,
          message,
          previous_response_id: threaded.checked ? lastResponseId : null,
        };
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.text();
          pending.textContent = '';
          pending.classList.add('err');
          pending.textContent = 'Error ' + res.status + ': ' + err;
          return;
        }
        const data = await res.json();
        lastResponseId = data.response_id;
        pending.textContent = data.reply || '(empty)';
        addTools(pending, data.tool_calls);
      } catch (err) {
        pending.textContent = 'Network error: ' + err;
        pending.classList.add('err');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
